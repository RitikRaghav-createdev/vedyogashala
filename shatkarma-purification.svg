<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 2000" width="1500" height="2000" role="img" aria-label="Shatkarma — classical yogic purification practices">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2D5540"/>
      <stop offset="0.55" stop-color="#33604A"/>
      <stop offset="1" stop-color="#3D6B4F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.28" r="0.75">
      <stop offset="0" stop-color="#E8956A" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#D4722A" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#D4722A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAF6F0"/>
      <stop offset="1" stop-color="#E8956A"/>
    </linearGradient>
  </defs>

  <rect width="1500" height="2000" fill="url(#bg)"/>
  <rect width="1500" height="2000" fill="url(#glow)"/>

  <!-- cleansing ripples -->
  <g fill="none" stroke="#FAF6F0" stroke-opacity="0.16">
    <circle cx="750" cy="1080" r="230" stroke-width="3"/>
    <circle cx="750" cy="1080" r="360" stroke-width="2.5"/>
    <circle cx="750" cy="1080" r="500" stroke-width="2"/>
    <circle cx="750" cy="1080" r="650" stroke-width="1.5"/>
  </g>
  <g fill="none" stroke="#E8956A" stroke-opacity="0.22">
    <circle cx="750" cy="1080" r="295" stroke-width="2"/>
    <circle cx="750" cy="1080" r="575" stroke-width="1.5"/>
  </g>

  <!-- six marks for the six kriyas, arced around the centre -->
  <g fill="#FAF6F0" fill-opacity="0.85">
    <circle cx="750" cy="640" r="11"/>
    <circle cx="953" cy="700" r="11"/>
    <circle cx="1058" cy="880" r="11"/>
    <circle cx="547" cy="700" r="11"/>
    <circle cx="442" cy="880" r="11"/>
    <circle cx="750" cy="600" r="6" fill="#E8956A" fill-opacity="1"/>
  </g>

  <!-- water droplet -->
  <path d="M750 800
           C 838 924, 906 1004, 906 1096
           a 156 156 0 1 1 -312 0
           C 594 1004, 662 924, 750 800 Z"
        fill="url(#drop)"/>
  <path d="M694 1064 a 56 56 0 0 0 40 74"
        fill="none" stroke="#2D5540" stroke-opacity="0.25" stroke-width="10" stroke-linecap="round"/>

  <!-- lotus at the base -->
  <g fill="none" stroke="#FAF6F0" stroke-opacity="0.5" stroke-width="4" stroke-linejoin="round">
    <path d="M750 1620 C 700 1520, 700 1470, 750 1420 C 800 1470, 800 1520, 750 1620 Z"/>
    <path d="M750 1620 C 640 1560, 605 1500, 610 1440 C 690 1460, 735 1520, 750 1620 Z"/>
    <path d="M750 1620 C 860 1560, 895 1500, 890 1440 C 810 1460, 765 1520, 750 1620 Z"/>
    <path d="M750 1626 C 560 1616, 470 1560, 470 1490 C 620 1500, 710 1560, 750 1626 Z" stroke-opacity="0.32"/>
    <path d="M750 1626 C 940 1616, 1030 1560, 1030 1490 C 880 1500, 790 1560, 750 1626 Z" stroke-opacity="0.32"/>
  </g>
  <path d="M470 1630 h 560" stroke="#E8956A" stroke-opacity="0.4" stroke-width="4" stroke-linecap="round"/>
</svg>
